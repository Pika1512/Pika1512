<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic Christmas - Ultimate</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
body{margin:0;overflow:hidden;background:#000;font-family:Segoe UI}
#canvas-container{width:100%;height:100vh}
#ui-layer{position:absolute;bottom:30px;width:100%;text-align:center;pointer-events:none;z-index:10}
.guide{color:rgba(255,255,255,.6);font-size:13px;margin-bottom:20px}
button{pointer-events:auto;cursor:pointer;background:#b71c1c;color:#fff;
border:2px solid gold;padding:15px 50px;border-radius:30px;font-weight:800}
#camera-preview{position:absolute;top:15px;right:15px;width:160px;height:120px;
border:2px solid rgba(255,0,0,.5);border-radius:8px;transform:scaleX(-1)}
</style>
</head>

<body>
<div id="ui-layer">
<div class="guide">
🖐 Open | 👌 Pinch | ❤️ Heart | ✊ Fist
</div>
<button onclick="startSystem()">START MAGIC</button>
</div>

<div id="canvas-container"></div>
<video class="input_video" style="display:none"></video>
<canvas id="camera-preview"></canvas>

<script>
/* ================= GLOBAL ================= */
let scene,camera,renderer;
let groupGold,groupRed,groupGift;
let titleMesh,starMesh,loveMesh;
let santaMesh,snow;
let fallingGifts=[],fireworks=[];
let state="TREE",handX=0.5,selectedIndex=0;

const MUSIC_URL="./audio.mp3";
const bgMusic=new Audio(MUSIC_URL);bgMusic.loop=true;

const loader=new THREE.TextureLoader();
const photoTextures=[
loader.load("https://pika1512.github.io/Pika1512/image1.jpeg"),
loader.load("https://pika1512.github.io/Pika1512/image2.jpeg"),
loader.load("https://pika1512.github.io/Pika1512/image3.jpeg"),
loader.load("https://pika1512.github.io/Pika1512/image4.jpeg"),
loader.load("https://pika1512.github.io/Pika1512/image5.jpeg")
];

const CONFIG={treeHeight:70,treeBaseRadius:35,explodeRadius:65,photoOrbitRadius:25};

/* ================= INIT ================= */
function init3D(){
scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x000000,.002);

camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1000);
camera.position.z=100;

renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.getElementById("canvas-container").appendChild(renderer.domElement);

groupGold=createTree(2000,0xFFD700,2);
groupRed=createTree(300,0xFF0000,3);
groupGift=createTree(150,0xFFFFFF,3);

createDecor();
createSnow();
animate();
}

/* ================= TREE ================= */
function createTree(count,color,size){
const geo=new THREE.BufferGeometry();
const pos=[],targets=[];
for(let i=0;i<count;i++){
const h=Math.random()*CONFIG.treeHeight;
const r=(1-h/CONFIG.treeHeight)*CONFIG.treeBaseRadius*Math.random();
const a=Math.random()*Math.PI*2;
pos.push(r*Math.cos(a),h-CONFIG.treeHeight/2,r*Math.sin(a));
targets.push(...pos.slice(-3));
}
geo.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
geo.userData.targets=targets;
const mat=new THREE.PointsMaterial({size,color,transparent:true});
const p=new THREE.Points(geo,mat);
scene.add(p);return p;
}

/* ================= DECOR ================= */
function createDecor(){
/* TEXT */
const c=document.createElement("canvas");c.width=1024;c.height=256;
const ctx=c.getContext("2d");
ctx.font="bold 90px serif";ctx.fillStyle="gold";
ctx.textAlign="center";ctx.fillText("MERRY CHRISTMAS",512,140);
titleMesh=new THREE.Mesh(
new THREE.PlaneGeometry(60,15),
new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true})
);
titleMesh.position.y=50;scene.add(titleMesh);

/* STAR */
starMesh=new THREE.Mesh(
new THREE.PlaneGeometry(12,12),
new THREE.MeshBasicMaterial({color:0xffff00})
);
starMesh.position.y=CONFIG.treeHeight/2+5;
scene.add(starMesh);

/* LOVE */
loveMesh=new THREE.Mesh(
new THREE.PlaneGeometry(70,18),
new THREE.MeshBasicMaterial({color:0xff69b4,transparent:true})
);
loveMesh.visible=false;scene.add(loveMesh);

/* SANTA */
santaMesh=new THREE.Mesh(
new THREE.PlaneGeometry(18,18),
new THREE.MeshBasicMaterial({
map:loader.load("https://i.imgur.com/6XgZQZC.png"),
transparent:true
})
);
scene.add(santaMesh);
}

/* ================= SNOW ================= */
function createSnow(){
const geo=new THREE.BufferGeometry();
const pos=new Float32Array(1000*3);
for(let i=0;i<pos.length;i+=3){
pos[i]=(Math.random()-.5)*200;
pos[i+1]=Math.random()*100;
pos[i+2]=(Math.random()-.5)*200;
}
geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
snow=new THREE.Points(geo,new THREE.PointsMaterial({
color:0xffffff,size:2,transparent:true
}));
scene.add(snow);
}

/* ================= GIFT ================= */
function spawnGift(){
const g=new THREE.Mesh(
new THREE.BoxGeometry(4,4,4),
new THREE.MeshStandardMaterial({color:0xd32f2f,emissive:0x550000})
);
g.position.set((Math.random()-.5)*60,80,(Math.random()-.5)*60);
scene.add(g);fallingGifts.push(g);
}

/* ================= FIREWORK ================= */
function spawnFirework(){
const geo=new THREE.BufferGeometry();
const pos=new Float32Array(120*3);
for(let i=0;i<pos.length;i+=3){
const a=Math.random()*Math.PI*2,r=Math.random()*10;
pos[i]=Math.cos(a)*r;pos[i+1]=Math.sin(a)*r;pos[i+2]=(Math.random()-.5)*r;
}
geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
const fw=new THREE.Points(geo,new THREE.PointsMaterial({
color:Math.random()*0xffffff,size:2.5,transparent:true
}));
fw.life=1;scene.add(fw);fireworks.push(fw);
}

/* ================= ANIMATE ================= */
function animate(){
requestAnimationFrame(animate);
const t=Date.now()*.001;

/* Santa bay */
santaMesh.position.set(Math.cos(t)*55,18+Math.sin(t*2)*4,Math.sin(t)*55);
santaMesh.lookAt(0,20,0);

/* Snow */
const p=snow.geometry.attributes.position.array;
for(let i=0;i<p.length;i+=3){p[i+1]-=.2;if(p[i+1]<-20)p[i+1]=100}
snow.geometry.attributes.position.needsUpdate=true;

/* Gifts */
fallingGifts.forEach((g,i)=>{
g.position.y-=.8;g.rotation.y+=.05;
if(g.position.y<-40){scene.remove(g);fallingGifts.splice(i,1)}
});

/* Fireworks */
fireworks.forEach((f,i)=>{
f.life-=.02;f.material.opacity=f.life;
if(f.life<=0){scene.remove(f);fireworks.splice(i,1)}
});

/* Music */
bgMusic.playbackRate=
state==="EXPLODE"?1.1:state==="HEART"?.85:state==="PHOTO"?.7:.9;

renderer.render(scene,camera);
}

/* ================= START ================= */
function startSystem(){
bgMusic.play();init3D();

const video=document.querySelector(".input_video");
const canvas=document.getElementById("camera-preview");
const ctx=canvas.getContext("2d");

const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
hands.setOptions({maxNumHands:2});
hands.onResults(r=>{
if(r.image){
canvas.width=canvas.clientWidth;
canvas.height=canvas.clientHeight;
ctx.drawImage(r.image,0,0,canvas.width,canvas.height);
}
if(r.multiHandLandmarks.length){
const lm=r.multiHandLandmarks[0];
handX=lm[9].x;
const pinch=Math.hypot(lm[4].x-lm[8].x,lm[4].y-lm[8].y);
const open=Math.hypot(lm[8].x-lm[0].x,lm[8].y-lm[0].y);
if(open<.25){state="TREE";if(Math.random()<.1)spawnGift()}
else if(pinch<.05){state="PHOTO"}
else{state="EXPLODE";if(Math.random()<.05)spawnFirework()}
}
});

new Camera(video,{onFrame:async()=>hands.send({image:video})}).start();
}
</script>
</body>
</html>
