<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic Christmas - Full Camera</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:"Segoe UI Emoji","Segoe UI",sans-serif;
}

/* ===== CAMERA FULL SCREEN ===== */
video.input_video{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    transform:scaleX(-1);
    z-index:-2;
}

/* ===== THREE CANVAS ===== */
#canvas-container{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    z-index:-1;
}

/* ===== UI ===== */
#ui-layer{
    position:absolute;
    bottom:30px;
    width:100%;
    text-align:center;
    z-index:10;
    pointer-events:none;
}

.guide{
    color:rgba(255,255,255,.7);
    font-size:13px;
    margin-bottom:18px;
    text-shadow:0 2px 4px #000;
}

button{
    pointer-events:auto;
    cursor:pointer;
    padding:15px 50px;
    font-weight:800;
    font-size:16px;
    border-radius:30px;
    border:2px solid #FFD700;
    color:#fff;
    background:linear-gradient(#D32F2F,#8B0000);
    box-shadow:0 0 30px rgba(255,0,0,.6);
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%{transform:scale(1)}
    50%{transform:scale(1.05)}
    100%{transform:scale(1)}
}

/* ===== CAMERA PREVIEW (FIX TO + RÕ) ===== */
#camera-preview{
    position:absolute;
    top:20px;
    right:20px;
    width:240px;
    height:180px;
    border:3px solid red;
    border-radius:12px;
    opacity:.8;
    transform:scaleX(-1);
    z-index:20;
}
</style>
</head>

<body>

<div id="ui-layer">
    <div class="guide">
        🖐 <b>Open:</b> Explode &nbsp;|&nbsp;
        👌 <b>Pinch:</b> Photo &nbsp;|&nbsp;
        ❤️ <b>Heart:</b> Love &nbsp;|&nbsp;
        ✊ <b>Fist:</b> Tree
    </div>
    <button id="btnStart" onclick="startSystem()">START MAGIC</button>
</div>

<div id="canvas-container"></div>
<video class="input_video" playsinline></video>
<canvas id="camera-preview"></canvas>

<script>
/* ================= THREE BASIC ================= */
let scene, camera, renderer;
let state="TREE";
let handX=0.5;

function init3D(){
    scene=new THREE.Scene();
    camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1000);
    camera.position.z=100;

    renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
    renderer.setSize(innerWidth,innerHeight);
    document.getElementById("canvas-container").appendChild(renderer.domElement);
    animate();
}

function animate(){
    requestAnimationFrame(animate);
    renderer.render(scene,camera);
}

/* ================= START SYSTEM ================= */
function startSystem(){
    document.getElementById("btnStart").style.display="none";
    init3D();

    const video=document.querySelector(".input_video");
    const canvas=document.getElementById("camera-preview");
    const ctx=canvas.getContext("2d");

    /* FIX: sync canvas size */
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;

    const hands=new Hands({
        locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });

    hands.setOptions({
        maxNumHands:2,
        modelComplexity:1,
        minDetectionConfidence:.5,
        minTrackingConfidence:.5
    });

    hands.onResults(res=>{
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(res.image,0,0,canvas.width,canvas.height);

        if(!res.multiHandLandmarks.length){
            state="TREE";
            return;
        }

        if(res.multiHandLandmarks.length===2){
            const h1=res.multiHandLandmarks[0];
            const h2=res.multiHandLandmarks[1];
            const d1=Math.hypot(h1[8].x-h2[8].x,h1[8].y-h2[8].y);
            const d2=Math.hypot(h1[4].x-h2[4].x,h1[4].y-h2[4].y);
            if(d1<.15 && d2<.15){
                state="HEART";
                return;
            }
        }

        const lm=res.multiHandLandmarks[0];
        handX=lm[9].x;
        const wrist=lm[0];
        const tips=[8,12,16,20];
        let open=0;
        tips.forEach(i=>open+=Math.hypot(lm[i].x-wrist.x,lm[i].y-wrist.y));
        const avg=open/4;
        const pinch=Math.hypot(lm[4].x-lm[8].x,lm[4].y-lm[8].y);

        if(avg<.25) state="TREE";
        else if(pinch<.05) state="PHOTO";
        else state="EXPLODE";
    });

    const cam=new Camera(video,{
        onFrame:async()=>{await hands.send({image:video});},
        width:window.innerWidth,
        height:window.innerHeight
    });
    cam.start();

    window.addEventListener("resize",()=>{
        video.width=innerWidth;
        video.height=innerHeight;
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
        camera.aspect=innerWidth/innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth,innerHeight);
    });
}
</script>

</body>
</html>
