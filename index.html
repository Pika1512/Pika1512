<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic Christmas</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:'Segoe UI',sans-serif;
}

#canvas-container{
    width:100%;
    height:100vh;
}

/* ===== UI ===== */
#ui-layer{
    position:absolute;
    bottom:30px;
    width:100%;
    text-align:center;
    z-index:30;
    pointer-events:none;
}

.guide{
    color:rgba(255,255,255,.7);
    font-size:14px;
    margin-bottom:15px;
}

button{
    pointer-events:auto;
    cursor:pointer;
    padding:14px 48px;
    border-radius:30px;
    border:2px solid #FFD700;
    background:linear-gradient(#D32F2F,#8B0000);
    color:#fff;
    font-weight:800;
    box-shadow:0 0 25px rgba(255,0,0,.6);
}

/* ===== CAMERA PREVIEW (PRO) ===== */
#camera-preview{
    position:absolute;
    top:20px;
    right:20px;
    width:360px;
    height:240px;
    background:#000;
    border-radius:18px;
    border:2px solid rgba(255,0,0,.6);
    transform:scaleX(-1);
    box-shadow:
        0 0 25px rgba(255,0,0,.5),
        inset 0 0 40px rgba(255,255,255,.05);
    z-index:50;
}

#copyright{
    position:absolute;
    right:15px;
    bottom:10px;
    color:rgba(255,255,255,.3);
    font-size:12px;
}
</style>
</head>

<body>

<div id="ui-layer">
    <div class="guide">
        🖐 Open → Explode |
        👌 Pinch → Photo |
        ❤️ Heart → Love |
        ✊ Fist → Tree
    </div>
    <button onclick="startSystem()">START MAGIC</button>
</div>

<div id="copyright">© vandiep</div>

<div id="canvas-container"></div>
<video class="input_video" playsinline style="display:none"></video>
<canvas id="camera-preview"></canvas>

<script>
/* ================= THREE ================= */
let scene,camera,renderer;
let state='TREE';
let handX=0.5;

function init3D(){
    scene=new THREE.Scene();
    camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);
    camera.position.z=100;

    renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth,innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    animate();
}

function animate(){
    requestAnimationFrame(animate);
    renderer.render(scene,camera);
}

/* ================= START ================= */
function startSystem(){
    init3D();
    initHands();
}

/* ================= MEDIAPIPE ================= */
function initHands(){
    const video=document.querySelector('.input_video');
    const canvas=document.getElementById('camera-preview');
    const ctx=canvas.getContext('2d');

    const hands=new Hands({
        locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
        maxNumHands:2,
        modelComplexity:1,
        minDetectionConfidence:0.5,
        minTrackingConfidence:0.5
    });

    hands.onResults(results=>{
        const cw=canvas.clientWidth;
        const ch=canvas.clientHeight;
        canvas.width=cw;
        canvas.height=ch;

        ctx.clearRect(0,0,cw,ch);
        if(!results.image) return;

        const vw=results.image.width;
        const vh=results.image.height;

        /* ===== cover scale ===== */
        const scale=Math.max(cw/vw,ch/vh);
        const dw=vw*scale;
        const dh=vh*scale;
        const dx=(cw-dw)/2;
        const dy=(ch-dh)/2;

        ctx.drawImage(results.image,dx,dy,dw,dh);

        /* overlay nhẹ */
        ctx.fillStyle="rgba(0,0,0,0.08)";
        ctx.fillRect(0,0,cw,ch);

        /* ===== gesture ===== */
        if(results.multiHandLandmarks.length){
            const lm=results.multiHandLandmarks[0];
            handX=lm[9].x;

            const tips=[8,12,16,20];
            let open=0;
            tips.forEach(i=>{
                open+=Math.hypot(lm[i].x-lm[0].x,lm[i].y-lm[0].y);
            });
            open/=4;

            const pinch=Math.hypot(lm[4].x-lm[8].x,lm[4].y-lm[8].y);

            if(open<0.25) state='TREE';
            else if(pinch<0.05) state='PHOTO';
            else state='EXPLODE';
        }
    });

    const cam=new Camera(video,{
        onFrame:async()=>await hands.send({image:video}),
        width:640,
        height:480
    });
    cam.start();
}

window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
