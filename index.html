<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic Christmas</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: "Segoe UI", sans-serif;
}

/* THREE CANVAS */
#canvas-container {
    width: 100vw;
    height: 100vh;
}

/* UI */
#ui-layer {
    position: absolute;
    bottom: 30px;
    width: 100%;
    text-align: center;
    pointer-events: none;
    z-index: 100;
}

.guide {
    color: rgba(255,255,255,0.65);
    font-size: 13px;
    margin-bottom: 18px;
    text-shadow: 0 2px 4px black;
}

button {
    pointer-events: auto;
    cursor: pointer;
    padding: 14px 48px;
    font-size: 16px;
    font-weight: 800;
    border-radius: 30px;
    border: 2px solid gold;
    background: linear-gradient(#d32f2f, #8b0000);
    color: white;
    box-shadow: 0 0 25px rgba(255,0,0,0.6);
    animation: pulse 1.4s infinite;
}

@keyframes pulse {
    0% {transform: scale(1)}
    50% {transform: scale(1.06)}
    100% {transform: scale(1)}
}

/* CAMERA PREVIEW – FULL */
#camera-preview {
    position: absolute;
    top: 15px;
    right: 15px;

    width: 360px;
    height: 240px;

    background: black;
    border-radius: 14px;
    border: 2px solid rgba(255,0,0,0.6);

    transform: scaleX(-1);
    opacity: 0.9;
    z-index: 200;

    box-shadow:
        0 0 20px rgba(255,0,0,0.4),
        inset 0 0 25px rgba(255,255,255,0.05);
}

#copyright {
    position: absolute;
    right: 15px;
    bottom: 10px;
    font-size: 12px;
    color: rgba(255,255,255,0.35);
    font-style: italic;
    z-index: 100;
}
</style>
</head>

<body>

<div id="canvas-container"></div>

<div id="ui-layer">
    <div class="guide">
        🖐 Open: Explode &nbsp;|&nbsp;
        👌 Pinch: Photo &nbsp;|&nbsp;
        ❤️ Heart: Love &nbsp;|&nbsp;
        ✊ Fist: Tree
    </div>
    <button onclick="startSystem()">START MAGIC</button>
</div>

<div id="copyright">© vandiep</div>

<video class="input_video" style="display:none"></video>
<canvas id="camera-preview"></canvas>

<script>
/* ================= MUSIC ================= */
const bgMusic = new Audio("./audio.mp3");
bgMusic.loop = true;
bgMusic.volume = 1.0;

/* ================= THREE ================= */
let scene, camera, renderer;
let groupGold, groupRed, groupGift;
let state = "TREE";
let handX = 0.5;

const CONFIG = {
    goldCount: 2000,
    redCount: 300,
    giftCount: 150,
    treeHeight: 70,
    treeBaseRadius: 35,
    explodeRadius: 65
};

function createTexture(color) {
    const c = document.createElement("canvas");
    c.width = c.height = 128;
    const ctx = c.getContext("2d");
    const g = ctx.createRadialGradient(64,64,0,64,64,45);
    g.addColorStop(0,"white");
    g.addColorStop(0.3,color);
    g.addColorStop(1,"transparent");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
}

const textures = {
    gold: createTexture("#FFD700"),
    red: createTexture("#FF0000"),
    gift: createTexture("#FFFFFF")
};

function init3D() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000,0.002);

    camera = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);
    camera.position.z = 100;

    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    document.getElementById("canvas-container").appendChild(renderer.domElement);

    groupGold = createParticles(textures.gold, CONFIG.goldCount, 2);
    groupRed  = createParticles(textures.red, CONFIG.redCount, 3);
    groupGift = createParticles(textures.gift, CONFIG.giftCount, 3);

    animate();
}

function createParticles(texture, count, size) {
    const pos = [];
    const targets = [];

    for(let i=0;i<count;i++){
        const h = Math.random()*CONFIG.treeHeight;
        const r = (1-h/CONFIG.treeHeight)*CONFIG.treeBaseRadius*Math.random();
        const a = Math.random()*Math.PI*2;
        const x = Math.cos(a)*r;
        const y = h - CONFIG.treeHeight/2;
        const z = Math.sin(a)*r;
        pos.push(x,y,z);

        const ex = (Math.random()-0.5)*CONFIG.explodeRadius;
        const ey = (Math.random()-0.5)*CONFIG.explodeRadius;
        const ez = (Math.random()-0.5)*CONFIG.explodeRadius;
        targets.push(ex,ey,ez);
    }

    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos,3));
    g.userData.targets = targets;

    const m = new THREE.PointsMaterial({
        size,
        map: texture,
        transparent:true,
        depthWrite:false,
        blending:THREE.AdditiveBlending
    });

    const p = new THREE.Points(g,m);
    scene.add(p);
    return p;
}

function updateGroup(group, speed) {
    const pos = group.geometry.attributes.position.array;
    const tar = group.geometry.userData.targets;
    for(let i=0;i<pos.length;i++){
        const t = (state==="TREE") ? 0 : 1;
        const target = t ? tar[i] : pos[i];
        pos[i] += (target - pos[i]) * speed;
    }
    group.rotation.y += (handX-0.5)*0.01;
    group.geometry.attributes.position.needsUpdate = true;
}

function animate() {
    requestAnimationFrame(animate);
    updateGroup(groupGold,0.05);
    updateGroup(groupRed,0.06);
    updateGroup(groupGift,0.07);
    renderer.render(scene,camera);
}

window.addEventListener("resize",()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
});

/* ================= MEDIAPIPE ================= */
function startSystem(){
    bgMusic.play().catch(()=>{});
    init3D();

    const video = document.querySelector(".input_video");
    const canvas = document.getElementById("camera-preview");
    const ctx = canvas.getContext("2d");

    const hands = new Hands({
        locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });

    hands.setOptions({
        maxNumHands:1,
        minDetectionConfidence:0.6,
        minTrackingConfidence:0.6
    });

    hands.onResults(res=>{
        const cw = canvas.clientWidth;
        const ch = canvas.clientHeight;
        canvas.width = cw;
        canvas.height = ch;

        ctx.clearRect(0,0,cw,ch);
        if(res.image){
            const vw = res.image.width;
            const vh = res.image.height;
            const scale = Math.max(cw/vw, ch/vh);
            const dw = vw*scale;
            const dh = vh*scale;
            ctx.drawImage(res.image,(cw-dw)/2,(ch-dh)/2,dw,dh);
        }

        if(res.multiHandLandmarks.length){
            const lm = res.multiHandLandmarks[0];
            handX = lm[9].x;
            const pinch = Math.hypot(lm[4].x-lm[8].x,lm[4].y-lm[8].y);
            state = pinch < 0.05 ? "EXPLODE" : "TREE";
        } else state="TREE";
    });

    const cam = new Camera(video,{
        onFrame: async()=> await hands.send({image:video}),
        width:640,
        height:480
    });
    cam.start();
}
</script>
</body>
</html>
