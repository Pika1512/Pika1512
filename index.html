<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic Christmas - Full</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

    button{
      pointer-events:auto; cursor:pointer;
      background: linear-gradient(to bottom, #D32F2F, #8B0000);

    /* Camera preview PRO (góc - to - full khung) */

      position:absolute; top:16px; right:16px;

    #copyright{

    }
  </style>
</head>

<body>
  <div id="error-log"></div>

  <div id="ui-layer">
    <div id="status" class="badge">🎄 Ready! Click START 🎄</div>
    <div class="guide">
      🖐 <b>Open:</b> Explode &nbsp;|&nbsp;
      👌 <b>Pinch:</b> Photo &nbsp;|&nbsp;
      ❤️ <b>Heart:</b> Love &nbsp;|&nbsp;
      ✊ <b>Fist:</b> Tree
    </div>
    <button id="btnStart" onclick="startSystem()">START MAGIC</button>
  </div>

  <div id="copyright">© vandiep</div>

  <div id="canvas-container"></div>
  <video class="input_video" playsinline style="display:none"></video>
  <canvas id="camera-preview"></canvas>

<script>
/* =========================
   0) Helpers
========================= */
function logError(e){
  const el = document.getElementById('error-log');
  el.style.display = 'block';
  el.textContent += (typeof e === 'string' ? e : (e?.message || e)) + "\n";
  console.error(e);
}

function setStatus(text, colorHex){
  const s = document.getElementById('status');
  s.textContent = text;
  if(colorHex) s.style.color = colorHex;
}

/* =========================
   1) Audio + Images
========================= */
const ASSET = {
  music: "./assets/audio.mp3",
  sfxTree: "./assets/sfx_tree.mp3",
  sfxExplode: "./assets/sfx_explode.mp3",
  sfxPhoto: "./assets/sfx_photo.mp3",
  sfxHeart: "./assets/sfx_heart.mp3",
};

// Nhạc nền
let bgMusic = new Audio(ASSET.music);
bgMusic.loop = true;
bgMusic.volume = 0.9;

// SFX (chuyển mode)
const sfx = {
  TREE: new Audio(ASSET.sfxTree),
  EXPLODE: new Audio(ASSET.sfxExplode),
  PHOTO: new Audio(ASSET.sfxPhoto),
  HEART: new Audio(ASSET.sfxHeart),
};
Object.values(sfx).forEach(a => { a.volume = 0.7; });

// Ảnh (đặt trong /images)
const photoFiles = [
  "./images/image1.jpeg",
  "./images/image2.jpeg",
  "./images/image3.jpeg",
  "./images/image4.jpeg",
  "./images/image5.jpeg",
  // muốn thêm ảnh thì thêm vào đây
];

const loader = new THREE.TextureLoader();
const photoTextures = [];
let photosReady = 0;

photoFiles.forEach((url, i) => {
  loader.load(
    url,
    (tex) => {
      photoTextures[i] = tex;
      photosReady++;
    },
    undefined,
    (err) => logError("Image load failed: " + url)
  );
});

/* =========================
   2) Textures for particles
========================= */
function createCustomTexture(type) {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  const cx = 64, cy = 64;

  if (type === 'gold_glow') {
    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, 44);
    grd.addColorStop(0, '#FFFFFF');
    grd.addColorStop(0.2, '#FFFFE0');
    grd.addColorStop(0.55, '#FFD700');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, 128, 128);

  } else if (type === 'red_light') {
    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, 56);
    grd.addColorStop(0, '#FFCCCC');
    grd.addColorStop(0.35, '#FF0000');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, 128, 128);

  } else if (type === 'gift_red') {
    ctx.fillStyle = '#D32F2F'; ctx.fillRect(20, 20, 88, 88);
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(54, 20, 20, 88);
    ctx.fillRect(20, 54, 88, 20);
    ctx.strokeStyle = "rgba(0,0,0,0.3)";
    ctx.lineWidth = 2;
    ctx.strokeRect(20, 20, 88, 88);
  }
  return new THREE.CanvasTexture(canvas);
}

const textures = {
  gold: createCustomTexture('gold_glow'),
  red: createCustomTexture('red_light'),
  gift: createCustomTexture('gift_red')
};

/* =========================
   3) Config + Globals
========================= */
const CONFIG = {
  goldCount: 2000,
  redCount: 300,
  giftCount: 150,

  explodeRadius: 65,
  photoOrbitRadius: 25,

  treeHeight: 70,
  treeBaseRadius: 35
};

let scene, camera, renderer;
let groupGold, groupRed, groupGift;
let photoMeshes = [];
let titleMesh, starMesh, loveMesh;

let state = 'TREE';
let prevState = 'TREE';
let selectedIndex = 0;
let handX = 0.5;

function playSfxForState(next){
  try{
    // chặn spam: chỉ phát khi đổi mode thật
    if(next === prevState) return;
    prevState = next;

    // reset & play
    const a = sfx[next];
    if(a){
      a.currentTime = 0;
      a.play().catch(()=>{});
    }
  }catch(e){ /* ignore */ }
}

function updateStatusByState(){
  if(state === 'TREE') setStatus("🎄 TREE MODE", "#FFD700");
  else if(state === 'EXPLODE') setStatus("🖐 EXPLODE MODE", "#FFA500");
  else if(state === 'PHOTO') setStatus("👌 PHOTO MODE", "#00E5FF");
  else if(state === 'HEART') setStatus("❤️ LOVE MODE", "#FF69B4");
}

/* =========================
   4) Three.js Init
========================= */
function init3D() {
  const container = document.getElementById('canvas-container');
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x000000, 0.002);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 100;

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.innerHTML = "";
  container.appendChild(renderer.domElement);

  groupGold = createParticleSystem('gold', CONFIG.goldCount, 2.0);
  groupRed  = createParticleSystem('red',  CONFIG.redCount,  3.5);
  groupGift = createParticleSystem('gift', CONFIG.giftCount, 3.0);

  createPhotos();
  createDecorations();

  animate();
}

function createParticleSystem(type, count, size) {
  const pPositions = [];
  const pExplodeTargets = [];
  const pTreeTargets = [];
  const pHeartTargets = [];
  const sizes = [];
  const phases = [];

  for (let i = 0; i < count; i++) {
    // TREE target (cone)
    const h = Math.random() * CONFIG.treeHeight;
    const y = h - CONFIG.treeHeight / 2;

    const radiusRatio = (type === 'gold') ? Math.sqrt(Math.random()) : 0.9 + Math.random() * 0.1;
    const maxR = (1 - (h / CONFIG.treeHeight)) * CONFIG.treeBaseRadius;
    const r = maxR * radiusRatio;
    const theta = Math.random() * Math.PI * 2;
    pTreeTargets.push(r * Math.cos(theta), y, r * Math.sin(theta));

    // EXPLODE target (sphere-ish)
    const u = Math.random(), v = Math.random();
    const phi = Math.acos(2 * v - 1);
    const lam = 2 * Math.PI * u;
    const radMult = (type === 'gift') ? 1.2 : 1.0;
    const rad = CONFIG.explodeRadius * Math.cbrt(Math.random()) * radMult;
    pExplodeTargets.push(
      rad * Math.sin(phi) * Math.cos(lam),
      rad * Math.sin(phi) * Math.sin(lam),
      rad * Math.cos(phi)
    );

    // HEART target (soft fill)
    const t = Math.random() * Math.PI * 2;
    let hx = 16 * Math.pow(Math.sin(t), 3);
    let hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    const rFill = Math.pow(Math.random(), 0.3);
    hx *= rFill; hy *= rFill;
    let hz = (Math.random() - 0.5) * 8 * rFill;

    const noise = 1.0;
    hx += (Math.random() - 0.5) * noise;
    hy += (Math.random() - 0.5) * noise;
    hz += (Math.random() - 0.5) * noise;

    const scaleH = 2.2;
    pHeartTargets.push(hx * scaleH, hy * scaleH + 5, hz);

    // init pos = tree
    pPositions.push(pTreeTargets[i * 3], pTreeTargets[i * 3 + 1], pTreeTargets[i * 3 + 2]);

    sizes.push(size);
    phases.push(Math.random() * Math.PI * 2);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pPositions, 3));
  geo.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

  const colors = new Float32Array(count * 3);
  const baseColor = new THREE.Color();
  if (type === 'gold') baseColor.setHex(0xFFD700);
  else if (type === 'red') baseColor.setHex(0xFF0000);
  else baseColor.setHex(0xFFFFFF);

  for (let i = 0; i < count; i++) {
    colors[i * 3] = baseColor.r;
    colors[i * 3 + 1] = baseColor.g;
    colors[i * 3 + 2] = baseColor.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  geo.userData = {
    tree: pTreeTargets,
    explode: pExplodeTargets,
    heart: pHeartTargets,
    phases,
    baseColor,
    baseSize: size
  };

  const mat = new THREE.PointsMaterial({
    size: size,
    map: textures[type],
    transparent: true,
    opacity: 1.0,
    vertexColors: true,
    blending: (type === 'gift') ? THREE.NormalBlending : THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true
  });

  const points = new THREE.Points(geo, mat);
  scene.add(points);
  return points;
}

/* =========================
   5) Photos
========================= */
function createPhotos() {
  const geo = new THREE.PlaneGeometry(8, 8);
  const borderGeo = new THREE.PlaneGeometry(9, 9);
  const borderMat = new THREE.MeshBasicMaterial({ color: 0xFFD700 });

  for (let i = 0; i < photoFiles.length; i++) {
    const mat = new THREE.MeshBasicMaterial({
      map: photoTextures[i] || null,
      side: THREE.DoubleSide,
      transparent: true
    });
    const mesh = new THREE.Mesh(geo, mat);

    const border = new THREE.Mesh(borderGeo, borderMat);
    border.position.z = -0.1;
    mesh.add(border);

    mesh.visible = false;
    mesh.scale.set(0, 0, 0);
    scene.add(mesh);
    photoMeshes.push(mesh);
  }
}

/* =========================
   6) Decorations
========================= */
function createDecorations() {
  // Title
  const canvas = document.createElement('canvas');
  canvas.width = 1024; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold italic 90px "Times New Roman"';
  ctx.fillStyle = '#FFD700';
  ctx.textAlign = 'center';
  ctx.shadowColor = "#FF0000";
  ctx.shadowBlur = 40;
  ctx.fillText("MERRY CHRISTMAS", 512, 130);

  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending });
  titleMesh = new THREE.Mesh(new THREE.PlaneGeometry(60, 15), mat);
  titleMesh.position.set(0, 50, 0);
  scene.add(titleMesh);

  // Star
  const starCanvas = document.createElement('canvas');
  starCanvas.width = 128; starCanvas.height = 128;
  const sCtx = starCanvas.getContext('2d');
  sCtx.fillStyle = "#FFFF00";
  sCtx.shadowColor = "#FFF";
  sCtx.shadowBlur = 20;

  sCtx.beginPath();
  const cx = 64, cy = 64, outer = 50, inner = 20;
  for (let i = 0; i < 5; i++) {
    sCtx.lineTo(cx + Math.cos((18 + i * 72) / 180 * Math.PI) * outer, cy - Math.sin((18 + i * 72) / 180 * Math.PI) * outer);
    sCtx.lineTo(cx + Math.cos((54 + i * 72) / 180 * Math.PI) * inner, cy - Math.sin((54 + i * 72) / 180 * Math.PI) * inner);
  }
  sCtx.closePath();
  sCtx.fill();

  const starTex = new THREE.CanvasTexture(starCanvas);
  const starMat = new THREE.MeshBasicMaterial({ map: starTex, transparent: true, blending: THREE.AdditiveBlending });
  starMesh = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), starMat);
  starMesh.position.set(0, CONFIG.treeHeight / 2 + 2, 0);
  scene.add(starMesh);

  // Love text
  const loveCanvas = document.createElement('canvas');
  loveCanvas.width = 1024; loveCanvas.height = 256;
  const lCtx = loveCanvas.getContext('2d');
  lCtx.font = 'bold 120px "Segoe UI", sans-serif';
  lCtx.fillStyle = '#FF69B4';
  lCtx.textAlign = 'center';
  lCtx.shadowColor = "#FF1493";
  lCtx.shadowBlur = 40;
  lCtx.fillText("I LOVE YOU ❤️", 512, 130);

  const loveTex = new THREE.CanvasTexture(loveCanvas);
  const loveMat = new THREE.MeshBasicMaterial({ map: loveTex, transparent: true, blending: THREE.AdditiveBlending });
  loveMesh = new THREE.Mesh(new THREE.PlaneGeometry(70, 18), loveMat);
  loveMesh.position.set(0, 0, 20);
  loveMesh.visible = false;
  scene.add(loveMesh);
}

/* =========================
   7) Animation logic
========================= */
function updateParticleGroup(group, type, targetState, speed, handRotY, time) {
  const positions = group.geometry.attributes.position.array;
  const sizesArr = group.geometry.attributes.size.array;
  const colors = group.geometry.attributes.color.array;
  const phases = group.geometry.userData.phases;
  const baseColor = group.geometry.userData.baseColor;
  const baseSize = group.geometry.userData.baseSize;

  const targetKey = (targetState === 'TREE') ? 'tree' : (targetState === 'HEART' ? 'heart' : 'explode');
  const targets = group.geometry.userData[(targetState === 'PHOTO') ? 'explode' : targetKey];

  // move to target
  for (let i = 0; i < positions.length; i++) {
    positions[i] += (targets[i] - positions[i]) * speed;
  }
  group.geometry.attributes.position.needsUpdate = true;

  // color/size
  const count = positions.length / 3;

  if (targetState === 'TREE') {
    group.rotation.y += 0.003;

    for (let i = 0; i < count; i++) {
      sizesArr[i] = baseSize;
      let brightness = 1.0;

      if (type === 'red') brightness = 0.5 + 0.5 * Math.sin(time * 3 + phases[i]);
      else if (type === 'gold') brightness = 0.8 + 0.4 * Math.sin(time * 10 + phases[i]);

      colors[i * 3] = baseColor.r * brightness;
      colors[i * 3 + 1] = baseColor.g * brightness;
      colors[i * 3 + 2] = baseColor.b * brightness;
    }
    group.geometry.attributes.color.needsUpdate = true;
    group.geometry.attributes.size.needsUpdate = true;
    group.scale.set(1, 1, 1);

  } else if (targetState === 'HEART') {
    group.rotation.y = 0;
    const beatScale = 1 + Math.abs(Math.sin(time * 3)) * 0.15;
    group.scale.set(beatScale, beatScale, beatScale);

    for (let i = 0; i < count; i++) {
      colors[i * 3] = baseColor.r;
      colors[i * 3 + 1] = baseColor.g;
      colors[i * 3 + 2] = baseColor.b;
      // bớt dày cho đẹp tim
      sizesArr[i] = (i % 3 === 0) ? baseSize : 0;
    }
    group.geometry.attributes.color.needsUpdate = true;
    group.geometry.attributes.size.needsUpdate = true;

  } else {
    group.scale.set(1, 1, 1);
    group.rotation.y += (handRotY - group.rotation.y) * 0.1;

    for (let i = 0; i < count; i++) {
      sizesArr[i] = baseSize;
      let brightness = 1.0;
      if (type === 'gold' || type === 'red') brightness = 0.8 + 0.5 * Math.sin(time * 12 + phases[i]);

      colors[i * 3] = baseColor.r * brightness;
      colors[i * 3 + 1] = baseColor.g * brightness;
      colors[i * 3 + 2] = baseColor.b * brightness;
    }
    group.geometry.attributes.size.needsUpdate = true;
    group.geometry.attributes.color.needsUpdate = true;
  }
}

function animate() {
  requestAnimationFrame(animate);
  const time = Date.now() * 0.001;
  const speed = 0.08;
  const handRotY = (handX - 0.5) * 4.0;

  // update particles
  updateParticleGroup(groupGold, 'gold', state, speed, handRotY, time);
  updateParticleGroup(groupRed, 'red', state, speed, handRotY, time);
  updateParticleGroup(groupGift, 'gift', state, speed, handRotY, time);

  // ensure photos textures after load
  photoMeshes.forEach((mesh, i) => {
    if (!mesh.material.map && photoTextures[i]) {
      mesh.material.map = photoTextures[i];
      mesh.material.needsUpdate = true;
    }
  });

  // show/hide by state
  if (state === 'TREE') {
    updateStatusByState();
    titleMesh.visible = true; starMesh.visible = true; loveMesh.visible = false;
    titleMesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
    starMesh.rotation.z -= 0.02;
    starMesh.material.opacity = 0.7 + 0.3 * Math.sin(time * 5);
    photoMeshes.forEach(m => { m.scale.lerp(new THREE.Vector3(0, 0, 0), 0.1); m.visible = false; });

  } else if (state === 'HEART') {
    updateStatusByState();
    titleMesh.visible = false; starMesh.visible = false; loveMesh.visible = true;
    photoMeshes.forEach(m => { m.visible = false; });
    const s = 1 + Math.abs(Math.sin(time * 3)) * 0.1;
    loveMesh.scale.set(s, s, 1);

  } else if (state === 'EXPLODE') {
    updateStatusByState();
    titleMesh.visible = false; starMesh.visible = false; loveMesh.visible = false;

    const baseAngle = groupGold.rotation.y;
    const angleStep = (Math.PI * 2) / Math.max(1, photoMeshes.length);
    let bestIdx = 0, maxZ = -999;

    photoMeshes.forEach((mesh, i) => {
      mesh.visible = true;
      const angle = baseAngle + i * angleStep;
      const x = Math.sin(angle) * CONFIG.photoOrbitRadius;
      const z = Math.cos(angle) * CONFIG.photoOrbitRadius;
      const y = Math.sin(time + i) * 3;

      mesh.position.lerp(new THREE.Vector3(x, y, z), 0.1);
      mesh.lookAt(camera.position);

      if (z > maxZ) { maxZ = z; bestIdx = i; }

      if (z > 5) {
        const ds = 1.0 + (z / CONFIG.photoOrbitRadius) * 0.8;
        mesh.scale.lerp(new THREE.Vector3(ds, ds, ds), 0.1);
      } else {
        mesh.scale.lerp(new THREE.Vector3(0.6, 0.6, 0.6), 0.1);
      }
    });
    selectedIndex = bestIdx;

  } else if (state === 'PHOTO') {
    updateStatusByState();
    loveMesh.visible = false;

    photoMeshes.forEach((mesh, i) => {
      if (i === selectedIndex) {
        mesh.visible = true;
        mesh.position.lerp(new THREE.Vector3(0, 0, 60), 0.1);
        mesh.scale.lerp(new THREE.Vector3(5, 5, 5), 0.1);
        mesh.lookAt(camera.position);
        mesh.rotation.z = 0;
      } else {
        mesh.scale.lerp(new THREE.Vector3(0, 0, 0), 0.1);
      }
    });
  }

  renderer.render(scene, camera);
}

/* =========================
   8) MediaPipe camera preview (corner)
========================= */
function drawCameraPreviewCover(ctx, canvas, image){
  const cw = canvas.clientWidth;
  const ch = canvas.clientHeight;
  canvas.width = cw;
  canvas.height = ch;

  ctx.clearRect(0,0,cw,ch);
  if(!image) return;

  const vw = image.width;
  const vh = image.height;

  // object-fit: cover
  const scale = Math.max(cw / vw, ch / vh);
  const dw = vw * scale;
  const dh = vh * scale;
  const dx = (cw - dw) / 2;
  const dy = (ch - dh) / 2;

  ctx.drawImage(image, dx, dy, dw, dh);

  // overlay nhẹ cho đẹp
  ctx.fillStyle = "rgba(0,0,0,0.08)";
  ctx.fillRect(0,0,cw,ch);
}

/* =========================
   9) Start System
========================= */
function startSystem() {
  document.getElementById('btnStart').style.display = 'none';
  setStatus("🔊 Starting...", "#FFD700");

  // play music (bắt buộc click mới chạy trên Chrome)
  bgMusic.play().then(() => {
    setStatus("🎵 Music ON", "#FFD700");
  }).catch(() => {
    setStatus("🔇 Clicked but music blocked (browser). Try click again.", "#FFD700");
  });

  init3D();

  const video = document.getElementsByClassName('input_video')[0];
  const canvas = document.getElementById('camera-preview');
  const ctx = canvas.getContext('2d');

  const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });

  hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  hands.onResults(results => {
    // draw preview corner (FULL khung)
    drawCameraPreviewCover(ctx, canvas, results.image);

    // ===== gesture logic =====
    let nextState = 'TREE';

    // Heart = 2 hands close
    if (results.multiHandLandmarks && results.multiHandLandmarks.length === 2) {
      const h1 = results.multiHandLandmarks[0];
      const h2 = results.multiHandLandmarks[1];
      const distIndex = Math.hypot(h1[8].x - h2[8].x, h1[8].y - h2[8].y);
      const distThumb = Math.hypot(h1[4].x - h2[4].x, h1[4].y - h2[4].y);
      if (distIndex < 0.15 && distThumb < 0.15) {
        nextState = 'HEART';
      }
    }

    if (nextState !== 'HEART') {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        handX = lm[9].x;

        const tips = [8, 12, 16, 20];
        const wrist = lm[0];
        let openDist = 0;
        tips.forEach(i => openDist += Math.hypot(lm[i].x - wrist.x, lm[i].y - wrist.y));
        const avgDist = openDist / 4;

        const pinchDist = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);

        if (avgDist < 0.25) nextState = 'TREE';
        else if (pinchDist < 0.05) nextState = 'PHOTO';
        else nextState = 'EXPLODE';
      } else {
        nextState = 'TREE';
      }
    }

    // apply + sfx when changed
    if (nextState !== state) {
      state = nextState;
      playSfxForState(state);
      updateStatusByState();
    }
  });

  const cameraUtils = new Camera(video, {
    onFrame: async () => {
      await hands.send({ image: video });
    },
    width: 640,
    height: 480
  });

  cameraUtils.start();
}

/* =========================
   10) Resize
========================= */
window.addEventListener('resize', () => {
  try{
    if (camera) {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  }catch(e){}
});
</script>
