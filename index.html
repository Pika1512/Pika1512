<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic Christmas - Fixed</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: 'Segoe UI', sans-serif;
}

#canvas-container {
    width: 100vw;
    height: 100vh;
}

/* UI */
#ui-layer {
    position: absolute;
    bottom: 30px;
    width: 100%;
    text-align: center;
    pointer-events: none;
    z-index: 100;
}

.guide {
    color: rgba(255,255,255,0.65);
    font-size: 13px;
    margin-bottom: 18px;
    text-shadow: 0 2px 4px black;
}

button {
    pointer-events: auto;
    cursor: pointer;
    background: linear-gradient(to bottom, #D32F2F, #8B0000);
    color: white;
    border: 2px solid gold;
    padding: 15px 50px;
    border-radius: 30px;
    font-weight: 800;
    font-size: 16px;
    box-shadow: 0 0 30px rgba(255,0,0,0.6);
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

/* ===== CAMERA PREVIEW FULL ===== */
#camera-preview {
    position: absolute;
    top: 15px;
    right: 15px;

    width: 360px;
    height: 240px;

    background: black;
    border-radius: 14px;
    border: 2px solid rgba(255,0,0,0.6);

    transform: scaleX(-1);
    opacity: 0.95;
    z-index: 200;

    box-shadow:
        0 0 20px rgba(255,0,0,0.5),
        inset 0 0 25px rgba(255,255,255,0.06);
}

#copyright {
    position: absolute;
    right: 15px;
    bottom: 10px;
    color: rgba(255,255,255,0.35);
    font-size: 12px;
    font-style: italic;
    z-index: 100;
}
</style>
</head>

<body>

<div id="canvas-container"></div>

<div id="ui-layer">
    <div class="guide">
        🖐 Open: Explode &nbsp;|&nbsp;
        👌 Pinch: Photo &nbsp;|&nbsp;
        ❤️ Heart: Love &nbsp;|&nbsp;
        ✊ Fist: Tree
    </div>
    <button onclick="startSystem()">START MAGIC</button>
</div>

<div id="copyright">© by vandiep</div>

<video class="input_video" style="display:none"></video>
<canvas id="camera-preview"></canvas>

<script>
/* ================= MUSIC ================= */
const bgMusic = new Audio("./audio.mp3");
bgMusic.loop = true;
bgMusic.volume = 1.0;

/* ================= THREE ================= */
let scene, camera, renderer;
let groupGold, groupRed, groupGift;
let state = "TREE";
let handX = 0.5;

const CONFIG = {
    goldCount: 2000,
    redCount: 300,
    giftCount: 150,
    treeHeight: 70,
    treeBaseRadius: 35,
    explodeRadius: 65
};

function createGlow(color){
    const c = document.createElement("canvas");
    c.width = c.height = 128;
    const ctx = c.getContext("2d");
    const g = ctx.createRadialGradient(64,64,0,64,64,45);
    g.addColorStop(0,"white");
    g.addColorStop(0.3,color);
    g.addColorStop(1,"transparent");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
}

const textures = {
    gold: createGlow("#FFD700"),
    red: createGlow("#FF0000"),
    gift: createGlow("#FFFFFF")
};

function init3D(){
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000,0.002);

    camera = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);
    camera.position.z = 100;

    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth,innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    document.getElementById("canvas-container").appendChild(renderer.domElement);

    groupGold = createParticles(textures.gold, CONFIG.goldCount, 2);
    groupRed  = createParticles(textures.red, CONFIG.redCount, 3);
    groupGift = createParticles(textures.gift, CONFIG.giftCount, 3);

    animate();
}

function createParticles(texture,count,size){
    const pos=[], exp=[];
    for(let i=0;i<count;i++){
        const h=Math.random()*CONFIG.treeHeight;
        const r=(1-h/CONFIG.treeHeight)*CONFIG.treeBaseRadius*Math.random();
        const a=Math.random()*Math.PI*2;
        pos.push(Math.cos(a)*r, h-CONFIG.treeHeight/2, Math.sin(a)*r);
        exp.push(
            (Math.random()-0.5)*CONFIG.explodeRadius,
            (Math.random()-0.5)*CONFIG.explodeRadius,
            (Math.random()-0.5)*CONFIG.explodeRadius
        );
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
    g.userData.exp=exp;

    const m=new THREE.PointsMaterial({
        size,map:texture,transparent:true,
        depthWrite:false,blending:THREE.AdditiveBlending
    });

    const p=new THREE.Points(g,m);
    scene.add(p);
    return p;
}

function update(group,speed){
    const p=group.geometry.attributes.position.array;
    const t=group.geometry.userData.exp;
    for(let i=0;i<p.length;i++){
        const target = (state==="EXPLODE") ? t[i] : p[i];
        p[i]+=(target-p[i])*speed;
    }
    group.rotation.y+=(handX-0.5)*0.01;
    group.geometry.attributes.position.needsUpdate=true;
}

function animate(){
    requestAnimationFrame(animate);
    update(groupGold,0.05);
    update(groupRed,0.06);
    update(groupGift,0.07);
    renderer.render(scene,camera);
}

window.addEventListener("resize",()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
});

/* ================= MEDIAPIPE ================= */
function startSystem(){
    bgMusic.play().catch(()=>{});
    init3D();

    const video=document.querySelector(".input_video");
    const canvas=document.getElementById("camera-preview");
    const ctx=canvas.getContext("2d");

    const hands=new Hands({
        locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
        maxNumHands:1,
        minDetectionConfidence:0.6,
        minTrackingConfidence:0.6
    });

    hands.onResults(res=>{
        const cw=canvas.clientWidth;
        const ch=canvas.clientHeight;
        canvas.width=cw;
        canvas.height=ch;
        ctx.clearRect(0,0,cw,ch);

        if(res.image){
            const vw=res.image.width;
            const vh=res.image.height;
            const scale=Math.max(cw/vw,ch/vh);
            ctx.drawImage(
                res.image,
                (cw-vw*scale)/2,
                (ch-vh*scale)/2,
                vw*scale,
                vh*scale
            );
        }

        if(res.multiHandLandmarks.length){
            const lm=res.multiHandLandmarks[0];
            handX=lm[9].x;
            const pinch=Math.hypot(lm[4].x-lm[8].x,lm[4].y-lm[8].y);
            state=pinch<0.05?"EXPLODE":"TREE";
        } else state="TREE";
    });

    const cam=new Camera(video,{
        onFrame:async()=>await hands.send({image:video}),
        width:640,height:480
    });
    cam.start();
}
</script>
</body>
</html>
