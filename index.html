<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Christmas - Final Clean</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000; 
            font-family: "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Segoe UI",sans-serif;
        }

        #canvas-container { width: 100%; height: 100vh; display: block; }
        
        #ui-layer {
            position: absolute; 
            bottom: 30px; 
            width: 100%;
            text-align: center; 
            pointer-events: none; 
            z-index: 100;
        }
        
        .guide { 
            color: rgba(255,255,255,0.7); 
            font-size: 13px; 
            margin-bottom: 20px; 
            text-shadow: 0 2px 4px black;
        }

        button {
            pointer-events: auto; 
            cursor: pointer;
            background: linear-gradient(to bottom, #D32F2F, #8B0000); 
            color: #FFF; 
            border: 2px solid #FFD700;
            padding: 15px 50px; 
            border-radius: 30px; 
            font-weight: 800; 
            font-size: 16px;
            box-shadow: 0 0 30px rgba(255,0,0,0.6);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.05); } 
            100% { transform: scale(1); } 
        }

        #camera-preview {
            position: absolute; 
            top: 15px; 
            right: 15px;
            width: 120px; 
            height: 90px;
            border: 2px solid rgba(255,0,0,0.5); 
            transform: scaleX(-1); 
            opacity: 0.6; 
            border-radius: 8px;
        }

        #copyright {
            position: absolute;
            bottom: 10px;
            right: 15px;
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
            font-style: italic;
        }
    </style>
</head>
<body>

<div id="ui-layer">
    <div class="guide">
        🖐 <b>Open:</b> Explode &nbsp;|&nbsp;
        ❤️ <b>Love:</b> Heart &nbsp;|&nbsp;
        ✊ <b>Fist:</b> Tree
    </div>
    <button id="btnStart" onclick="startSystem()">START MAGIC</button>
</div>

<div id="copyright">© by vandiep</div>

<div id="canvas-container"></div>
<video class="input_video" style="display:none"></video>
<canvas id="camera-preview"></canvas>

<script>
/* =======================
   RESOURCES
======================= */
const MUSIC_URL = "./audio.mp3";
let bgMusic = new Audio(MUSIC_URL);
bgMusic.loop = true;
bgMusic.volume = 1.0;

const loader = new THREE.TextureLoader();
const photoFiles = [
  "https://pika1512.github.io/demo/image1.jpeg",
  "https://pika1512.github.io/demo/image2.jpeg",
  "https://pika1512.github.io/demo/image3.jpeg",
  "https://pika1512.github.io/demo/image4.jpeg",
  "https://pika1512.github.io/demo/image5.jpeg"
];
const photoTextures = photoFiles.map(f => loader.load(f));

/* =======================
   THREE BASIC
======================= */
let scene, camera, renderer;
let groupGold, groupRed, groupGift;
let photoMeshes = [];
let titleMesh, starMesh, loveMesh;
let state = "TREE";
let selectedIndex = 0;
let handX = 0.5;

/* =======================
   TEXTURE HELPERS
======================= */
function glowTexture(color) {
    const c = document.createElement("canvas");
    c.width = c.height = 128;
    const g = c.getContext("2d");
    const grd = g.createRadialGradient(64,64,0,64,64,50);
    grd.addColorStop(0,"#fff");
    grd.addColorStop(0.4,color);
    grd.addColorStop(1,"rgba(0,0,0,0)");
    g.fillStyle = grd;
    g.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
}

const textures = {
    gold: glowTexture("#FFD700"),
    red: glowTexture("#FF0000"),
    gift: glowTexture("#FFD700")
};

/* =======================
   INIT 3D
======================= */
function init3D() {
    const container = document.getElementById("canvas-container");
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.002);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.z = 100;

    renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    groupGold = createParticles("gold", 2000, 2);
    groupRed  = createParticles("red", 300, 3.5);
    groupGift = createParticles("gift", 150, 3);

    createPhotos();
    animate();
}

/* =======================
   PARTICLES
======================= */
function createParticles(type, count, size) {
    const pos = [];
    const targets = [];
    for(let i=0;i<count;i++){
        const r = Math.random()*35;
        const a = Math.random()*Math.PI*2;
        const y = Math.random()*70-35;
        pos.push(r*Math.cos(a),y,r*Math.sin(a));
        targets.push(
            (Math.random()-0.5)*60,
            (Math.random()-0.5)*60,
            (Math.random()-0.5)*60
        );
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos,3));
    g.userData.explode = targets;

    const m = new THREE.PointsMaterial({
        size:size,
        map:textures[type],
        transparent:true,
        blending:THREE.AdditiveBlending,
        depthWrite:false
    });
    const p = new THREE.Points(g,m);
    scene.add(p);
    return p;
}

/* =======================
   PHOTOS
======================= */
function createPhotos(){
    const geo = new THREE.PlaneGeometry(8,8);
    for(let i=0;i<5;i++){
        const mat = new THREE.MeshBasicMaterial({map:photoTextures[i]});
        const m = new THREE.Mesh(geo,mat);
        m.visible=false;
        photoMeshes.push(m);
        scene.add(m);
    }
}

/* =======================
   LOOP
======================= */
function animate(){
    requestAnimationFrame(animate);
    renderer.render(scene,camera);
}

/* =======================
   START SYSTEM
======================= */
function startSystem(){
    document.getElementById("btnStart").style.display="none";
    bgMusic.play().catch(()=>{});
    init3D();
}
</script>
</body>
</html>
